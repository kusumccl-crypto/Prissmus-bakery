<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💖</title>

<link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&display=swap" rel="stylesheet">

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    background: linear-gradient(135deg, #ffd1dc, #ffe6eb);
    display: flex;
    justify-content: center;
    align-items: center;
    font-family: 'Quicksand', sans-serif;
    overflow: hidden;
}

.card {
    background: rgba(255,255,255,0.92);
    width: 340px;
    padding: 25px;
    border-radius: 25px;
    box-shadow: 0 20px 40px rgba(0,0,0,0.15);
    text-align: center;
    position: relative;
}

.card img {
    width: 100%;
    border-radius: 20px;
    margin-bottom: 15px;
}

h1 {
    color: #ff4d6d;
    font-size: 22px;
    margin-bottom: 20px;
}

.buttons {
    position: relative;
    height: 60px;
}

button {
    border: none;
    padding: 12px 22px;
    border-radius: 30px;
    font-size: 16px;
    cursor: pointer;
    transition: 0.3s ease;
    position: absolute;
}

#yes {
    background: linear-gradient(135deg, #ff4d6d, #ff758f);
    color: white;
    left: 50%;
    transform: translateX(-50%);
    box-shadow: 0 8px 20px rgba(255,77,109,0.4);
}

#yes:hover {
    transform: translateX(-50%) scale(1.1);
}

#no {
    background: #d3d3d3;
    color: #444;
    left: 10%;
}

.heart {
    position: absolute;
    color: #ff4d6d;
    font-size: 14px;
    animation: float 4s linear infinite;
}

@keyframes float {
    0% { transform: translateY(0); opacity: 1; }
    100% { transform: translateY(-120vh); opacity: 0; }
}

.confetti {
    position: absolute;
    pointer-events: none;
    animation: confettiFall 2.5s ease-out forwards;
}

@keyframes confettiFall {
    0% {
        transform: translateY(0) scale(1);
        opacity: 1;
    }
    100% {
        transform: translateY(250px) rotate(360deg) scale(0.5);
        opacity: 0;
    }
}
</style>
</head>

<body>

<div class="card" id="card">
    <img id="img" src="https://instasize.com/p/879d37b55cad36e3ce86fd5046d21becff15c7b8b0980ef81e7c9f680c59a272">
    <h1 id="text">Will you be my Valentine? 💕</h1>

    <div class="buttons">
        <button id="yes">YES 💖</button>
        <button id="no">NO 🙄</button>
    </div>
</div>

<script>
const noBtn = document.getElementById("no");
const yesBtn = document.getElementById("yes");
const img = document.getElementById("img");
const text = document.getElementById("text");
const card = document.getElementById("card");

// NO button runs away
noBtn.addEventListener("mouseover", () => {
    const x = Math.random() * 220;
    const y = Math.random() * 40;
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
});

// YES clicked
yesBtn.addEventListener("click", () => {
    img.src = "https://instasize.com/p/b2e33de7e3c610516c0662c4609449e279351eecf94e9c05a818596d28f76968";
    text.innerHTML = "YAYYY 💞 You’re my Valentine!";
    document.querySelector(".buttons").style.display = "none";
    confettiExplosion();
});

// Floating hearts continuously
setInterval(() => {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerHTML = "💖";
    heart.style.left = Math.random() * 100 + "%";
    heart.style.bottom = "-20px";
    heart.style.fontSize = Math.random() * 10 + 12 + "px";
    document.body.appendChild(heart);

    setTimeout(() => heart.remove(), 4000);
}, 300);

// CONFETTI HEART EXPLOSION
function confettiExplosion() {
    const emojis = ["💖", "💘", "💕", "💗", "✨"];

    for (let i = 0; i < 80; i++) {
        const confetti = document.createElement("div");
        confetti.classList.add("confetti");
        confetti.innerHTML = emojis[Math.floor(Math.random() * emojis.length)];

        confetti.style.left = Math.random() * 100 + "%";
        confetti.style.top = "40%";
        confetti.style.fontSize = Math.random() * 12 + 14 + "px";
        confetti.style.animationDuration = Math.random() * 1 + 1.5 + "s";

        document.body.appendChild(confetti);

        setTimeout(() => confetti.remove(), 3000);
    }
}
</script>

</body>
</html>
